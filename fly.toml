app = "punch-list-monitoring"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "punch_data"
  destination = "/var/www/html/database"
  initial_size = "1gb"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
